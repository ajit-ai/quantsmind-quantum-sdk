name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check src/quantsmind/quantum tests/unit/quantum

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,quantum]"
      - run: mypy --strict src/quantsmind/quantum

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,quantum]"
      - run: pytest tests/unit --cov=quantsmind --cov-report=xml
      - name: Quantum coverage gate (>=80% on the stable surface)
        run: pytest tests/unit/quantum --cov=quantsmind.quantum --cov-report=term --cov-fail-under=80 -q
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
