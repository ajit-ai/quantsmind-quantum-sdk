name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check tag and package version agree
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag version: ${TAG_VERSION}"
          echo "package version: ${PACKAGE_VERSION}"
          test "${TAG_VERSION}" = "${PACKAGE_VERSION}"

      - name: Install build tooling
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify expected distributions exist
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test -f "dist/quantsmind-${TAG_VERSION}-py3-none-any.whl"
          test -f "dist/quantsmind-${TAG_VERSION}.tar.gz"
          test "$(ls dist/quantsmind-*.whl dist/quantsmind-*.tar.gz | wc -l)" = "2"

      - name: Verify wheel installs and imports cleanly
        run: |
          pip install dist/*.whl
          python -c "import quantsmind; print('import OK:', quantsmind.__version__)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  testpypi:
    name: Publish to TestPyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Verify expected distributions exist
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test -f "dist/quantsmind-${TAG_VERSION}-py3-none-any.whl"
          test -f "dist/quantsmind-${TAG_VERSION}.tar.gz"
          test "$(ls dist/quantsmind-*.whl dist/quantsmind-*.tar.gz | wc -l)" = "2"

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    needs: [testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/quantsmind
    permissions:
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Verify expected distributions exist
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test -f "dist/quantsmind-${TAG_VERSION}-py3-none-any.whl"
          test -f "dist/quantsmind-${TAG_VERSION}.tar.gz"
          test "$(ls dist/quantsmind-*.whl dist/quantsmind-*.tar.gz | wc -l)" = "2"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
