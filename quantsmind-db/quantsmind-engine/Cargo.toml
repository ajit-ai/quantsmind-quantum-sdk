[package]
name = "quantsmind-engine"
version = "0.1.0"
edition = "2021"
authors = ["QuantsMind Team"]
description = "High-performance relational database engine for quantitative finance"

[lib]
name = "quantsmind_engine"
path = "src/lib.rs"

[[bin]]
name = "quantsmind-engine"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
# SQL parsing
sqlparser = "0.43"
# gRPC
tonic = "0.11"
prost = "0.12"
# Concurrency
parking_lot = "0.12"
# UUID support
uuid = { version = "1.6", features = ["v4", "serde"] }
# Error handling
thiserror = "1.0"
anyhow = "1.0"
# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
# Date/time
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
tonic-build = "0.11"
