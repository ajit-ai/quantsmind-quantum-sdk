[package]
name = "quantsmind-studio"
version = "0.1.0"
description = "QuantsMind Visual Database Studio"
authors = ["QuantsMind Team"]
edition = "2021"

[dependencies]
# Tauri dependencies
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# QuantsMind Engine (local dependency)
quantsmind-engine = { path = "../../quantsmind-engine" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }
