[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "quantsmind"
version = "1.0.0"
description = "QuantsMind SDK - a universal, vendor-independent scientific computing SDK."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "QuantsMind SDK Contributors" },
]
keywords = [
    "scientific-computing", "quantum-computing", "mathematics", "physics",
    "chemistry", "biology", "astronomy", "cosmology", "finance", "ai",
    "simulation", "optimization",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]
dependencies = []

[project.optional-dependencies]
api = [
    "pydantic>=2",
]
quantum = [
    "microquantum>=0.4.0,<0.5.0",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
]

[project.urls]
Homepage = "https://github.com/quantsmind/quantsmind-sdk"
Documentation = "https://github.com/quantsmind/quantsmind-sdk/tree/main/docs"
Changelog = "https://github.com/quantsmind/quantsmind-sdk/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/quantsmind/quantsmind-sdk/blob/main/ROADMAP.md"

[tool.hatch.build.targets.wheel]
packages = ["src/quantsmind"]

[tool.hatch.build.targets.sdist]
# The sdist is the source distribution for QuantsMind Quantum 1.0.0.
# Exclude local-only/dev-only trees so the published artifact matches the
# source tree that produces the wheel.
exclude = [
    "venv",
    ".venv",
    "dist",
    "build",
    "*.egg-info",
    "quantsmind-db",
    "docs",
    "research",
    "tutorials",
    "benchmarks",
    "scripts",
    "tools",
    "configs",
    "assets",
    "archives",
    ".github",
    "icon.ico",
    "icon.png",
    "mypy_*.txt",
    "ruff_*.txt",
    "test_*.txt",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["quantsmind"]

[tool.ruff.lint.per-file-ignores]
# Top-level __init__ re-declares its public API lazily via PEP 562; the
# TYPE_CHECKING imports exist purely as the static-analysis surface.
"src/quantsmind/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["quantsmind"]
mypy_path = "src"
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/quantsmind"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
