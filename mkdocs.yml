      - API Foundations: api.md
      - Datasets Foundations: datasets.md
      - IO Foundations: io.md
      - AI Foundations: ai.md
      - Knowledge Foundations: knowledge.md
      - Physics Foundations: physics.md
      - Chemistry Foundations: chemistry.md
      - Biology Foundations: biology.md
      - Astronomy Foundations: astronomy.md
