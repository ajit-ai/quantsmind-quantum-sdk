site_name: QuantsMind SDK
site_description: A Universal Scientific Computing SDK
site_url: https://ajit-ai.github.io/quantsmind-quantum-sdk/
repo_url: https://github.com/ajit-ai/quantsmind-quantum-sdk
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.expand
    - navigation.top
    - toc.integrate
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - src
          options:
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_submodules: true
            docstring_style: google
            members_order: source

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite

nav:
